name: T-Display-S3 with SmartConfig + S3LCD Driver and Octal SPIRAM

permissions:
  contents: write

on:
  push:
    tags:
     - 'v*'
#  schedule:
 #    - cron: '0 0 1 * *'
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone this repo
      uses: actions/checkout@v7
      
    - name: Clone Micropython now with smartconfig thanks to Walkline80
      run: git clone --recurse-submodules https://github.com/micropython/micropython.git

    - name: Install yq
      run: sudo apt-get update && sudo apt-get install -y yq

    - id: idf_ver
      name: Extract IDF version from MicroPython workflow
      run: |
        cd micropython
        IDF_VER=$(yq '.env.IDF_NEWEST_VER' .github/workflows/ports_esp32.yml | tr -d '"')
        echo "IDF_VER=$IDF_VER" >> $GITHUB_OUTPUT
        
    - name: Clone repo smartconfig by Walkline80
      run: git clone https://gitee.com/walkline/micropython-smartconfig-cmodule.git smartconfig
    
    - name: Clonar s3lcd
      run: git clone https://github.com/russhughes/s3lcd.git

    - name: Parchear s3lcd.c para ESP-IDF >=v5.4.2
      run: sed -i 's/self->bus_handle.spi = NULL;/self->bus_handle.spi = 0;/' $GITHUB_WORKSPACE/s3lcd/src/s3lcd.c

    - name: Aplicar parche para errores de mp_raise_ValueError
      run: |
        sed -i 's/mp_raise_ValueError(\(.*\));/mp_raise_ValueError(MP_ERROR_TEXT(\1));/' $GITHUB_WORKSPACE/s3lcd/src/s3lcd_i80_bus.c

    - name: Copy tdt_config and config_buttons and fonts
      run: |
       cp "$GITHUB_WORKSPACE/s3lcd/examples/configs/t-display-s3/tft_config.py" "$GITHUB_WORKSPACE/s3lcd/modules/"
       cp "$GITHUB_WORKSPACE/s3lcd/examples/configs/t-display-s3/tft_buttons.py" "$GITHUB_WORKSPACE/s3lcd/modules/"
      
    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y git wget cmake ninja-build

    - name: Setup ESP-IDF
      run: |
        if [ ! -d "esp-idf" ]; then
          git clone --depth 1 --branch ${{ steps.idf_ver.outputs.IDF_VER }} https://github.com/espressif/esp-idf.git
          git -C esp-idf submodule update --init --recursive --depth=1
        fi
        
        if [ ! -d "$HOME/.espressif/python_env" ]; then
          echo "Instalando entorno virtual de ESP-IDF..."
          ./esp-idf/install.sh
        fi
   
    - name: Set up environment
      run: |
        source esp-idf/export.sh
        echo "IDF_PATH=$GITHUB_WORKSPACE/esp-idf" >> $GITHUB_ENV
        idf.py --version

    - name: Get MicroPython Version from mpconfig.h
      run: |
        cd micropython/
        MAJOR=$(grep -oP '(?<=#define MICROPY_VERSION_MAJOR )[0-9]+' py/mpconfig.h)
        MINOR=$(grep -oP '(?<=#define MICROPY_VERSION_MINOR )[0-9]+' py/mpconfig.h)
        MICRO=$(grep -oP '(?<=#define MICROPY_VERSION_MICRO )[0-9]+' py/mpconfig.h)
        PRERELEASE=$(grep -oP '(?<=#define MICROPY_VERSION_PRERELEASE )[0-9]+' py/mpconfig.h)

        if [ "$PRERELEASE" -eq 1 ]; then
          MPY_VERSION="$MAJOR.$MINOR.$MICRO-preview"
        else
          MPY_VERSION="$MAJOR.$MINOR.$MICRO"
        fi

        echo "MPY_VERSION=$MPY_VERSION" >> $GITHUB_ENV

    - name: Create git tag with version (if not exists)
      run: |
        cd micropython
        TAG="v${{ env.MPY_VERSION }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "El tag $TAG ya existe, omitiendo..."
        else
          git tag "$TAG"
          echo "Tag creado: $TAG"
        fi
    
    - name: Copy board configuration (No more needed)
      if: false
      run: |
        cp -r ESP32_GENERIC_S3_N16R8 micropython/ports/esp32/boards/

    - name: Copiar tabla de particiones personalizada (No more needed)
      if: false
      run: |
        cp "$GITHUB_WORKSPACE/ESP32_GENERIC_S3_N16R8/partitions-16MiB.csv" "$GITHUB_WORKSPACE/micropython/ports/esp32/partitions-16MiB.csv"

    - name: Crear partitions-16MiBplus.csv personalizado
      run: |
        cat > $GITHUB_WORKSPACE/micropython/ports/esp32/partitions-16MiBplus.csv << 'EOF'
        # Name,   Type, SubType, Offset,  Size, Flags
        nvs,      data, nvs,     0x9000,  0x6000,
        phy_init, data, phy,     0xf000,  0x1000,
        factory,  app,  factory, 0x10000, 0x300000,
        vfs,      data, fat,     0x310000, 0xCF0000,
        EOF

    - name: Debug partition table
      run: |
        echo "===== partitions-16MiBplus.csv ====="
        cat $GITHUB_WORKSPACE/micropython/ports/esp32/partitions-16MiBplus.csv

    - name: Edit sdkconfig.base for 16MB flash
      run: |
        sed -i 's/CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y/CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y/' $GITHUB_WORKSPACE/micropython/ports/esp32/boards/sdkconfig.base
        sed -i 's/CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions-4MiBplus.csv"/CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions-16MiBplus.csv"/' $GITHUB_WORKSPACE/micropython/ports/esp32/boards/sdkconfig.base
        echo "sdkconfig.base modificado:"
        grep -E "CONFIG_ESPTOOLPY_FLASHSIZE|CONFIG_PARTITION_TABLE_CUSTOM_FILENAME" $GITHUB_WORKSPACE/micropython/ports/esp32/boards/sdkconfig.base
    
    - name: Compile MicroPython with S3LCD + SmartConfig
      run: |
        source esp-idf/export.sh
        cd ${{ github.workspace }}/micropython
        make -j$(nproc) -C mpy-cross
        make -j$(nproc) -C ports/esp32 submodules
        cd ports/esp32/
        make -j$(nproc) BOARD=ESP32_GENERIC_S3 BOARD_VARIANT=SPIRAM_OCT \
          USER_C_MODULES="$GITHUB_WORKSPACE/micropython.cmake" \
          FROZEN_MANIFEST="$GITHUB_WORKSPACE/s3lcd/manifest.py"
    
    - name: Move binaries with S3LCD + SmartConfig
      run: |
        mkdir -p ./artifacts
        BUILD="micropython/ports/esp32/build-ESP32_GENERIC_S3-SPIRAM_OCT"
        cp $BUILD/firmware.bin artifacts/
        cp $BUILD/micropython.bin ./artifacts/micropython.bin || true
        cp $BUILD/bootloader/bootloader.bin ./artifacts/bootloader.bin || true
        cp $BUILD/partition_table/partition-table.bin ./artifacts/partition-table.bin || true
    
    - name: Generate Tag
      id: tag
      run: echo "TAG_NAME=release-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: Verificar existencia de los cuatro binarios
      run: |
        if [ ! -f ./artifacts/firmware.bin ] || [ ! -f ./artifacts/micropython.bin ] || [ ! -f ./artifacts/bootloader.bin ] || [ ! -f ./artifacts/partition-table.bin ]; then
          echo "Falta uno o más archivos binarios necesarios, cancelando release."
          exit 1
        fi

    - name: GH Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "MicroPython for LilyGo T-Display S3 Octal SPIRAM with S3LCD Driver and SmartConfig by Walkline80 release version ${{ env.MPY_VERSION }} (Build ${{ env.TAG_NAME }})"
        body: |
          Automated release for MicroPython.
          
          ## What we get here:
          - MicroPython with S3LCD Display Driver and SmartConfig module:
            - ```firmware.bin, micropython.bin, bootloader.bin and partition-table.bin.```
            `firmware.bin`has `micropython.bin + bootloader.bin + partition-table.bin`in just one file.
            
          # Instructions
            You need to have some dependencies pre-instaled in your OS:
            - Python 3
            - Pip
            - Python VENV
          
          ## Windows or Linux:
          Create Virtual Environment
          
          ```python
          python -m venv esp-env
          ```
          
          ### On Windows activate Virtual Environment this way:
          
          ```python
          .\esp-env\Scripts\activate
          ```
          
          ### On Linux activate Virtual Environment this way:
          
          ```bash
          source esp-env/bin/activate
          ```
          
          ### On Windows or Linux install esptool:
          
          ```python
          pip install esptool
          ```
          
          ### Put T-Display-S3 in BOOTLOADER MODE:
          - With USB cable on USB COM Port, press BOOT button then RST button, release RST, then release BOOT button. Or unplug, press BOOT button meanwhile you plug in the usb cable to PC or SBC like a Raspberry Pi.
          - Alternative: Use Thonny IDE, plug your T-Display-S3, on Thonny Shell type:
          
          ```python
          from machine import bootloader
          ```
          
          Press ``Enter`` then type:
          
          ```python
          bootloader()
          ```
          
          Press ``Enter`` then just close Thonny and go to Terminal with Virtual Environment activate.
          
          ### Erase Flash:
          
          ```python
          python -m esptool erase-flash
          ```
          
          ### Then Flash:
          - Put 3 binaries in the same folder you are executing the steps, example Downloads folder, you need to be in that folder where are the binaries.
          
          ```python
          python -m esptool write-flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 micropython.bin
          ```

          - Or just `firmware.bin`:

          ```python
          python -m esptool write-flash 0x0 firmware.bin
          ```

          ### You can check from MicroPython Shell on Thonny with:
          
          ```python
          help('modules')
          ```
          
          The modules in MicroPython.
                    
          ### NOTE IN WINDOWS:
          - If you get a PowerShell Scripts Policy Execution Exception that don't let you activate the Virtual Environment:
          
           ```powershell
          .\esp-env\Scripts\activate
          ```
          
          - Then open a Terminal like Administrator and type:
          
          ```powershell
          Set-ExecutionPolicy Unrestricted
          ```
          
          - Close the Terminal now you can activate the Python Virtual Enmvironment
          
          - [ESPWebTool Flasher](https://esptool.spacehuhn.com/):
          
          ```bash
          - Put in Bootloader. Choose the USB/JTAG port.
          - ERASE button first.
          - Let it only:
            - 0x0 bootloader.bin
            - 0x8000 partition-table.bin
            - 0x10000 micropython.bin
            - Press PROGRAM after done, press RST button or Unplug the Board.
          ```
          
        draft: false
        prerelease: false
        files: ./artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
